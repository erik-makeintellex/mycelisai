{{- if .Values.frameworkWorker.enabled }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "frameworkWorker requires networkPolicy.enabled=true" }}
{{- end }}
{{- if not .Values.frameworkWorker.database.egressCIDRs }}
{{- fail "frameworkWorker.database.egressCIDRs must name the dedicated database destination" }}
{{- end }}
{{- range .Values.frameworkWorker.database.egressCIDRs }}
{{- if not (regexMatch "^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/32$" .) }}
{{- fail "frameworkWorker.database.egressCIDRs accepts only exact IPv4 /32 database hosts" }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-framework-runs
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: framework-runs
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Chart.Name }}
      ports:
        - protocol: TCP
          port: 8091
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- range .Values.frameworkWorker.database.egressCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.frameworkWorker.database.port }}
{{- end }}
