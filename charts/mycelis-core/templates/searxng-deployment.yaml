{{- if and .Values.searxng .Values.searxng.enabled }}
{{- if and .Values.searxng.secret (not .Values.searxng.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-searxng-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}-searxng
type: Opaque
stringData:
  {{ default "searxng-secret" .Values.searxng.secretKey }}: {{ .Values.searxng.secret | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-searxng-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}-searxng
data:
  settings.yml: |
    use_default_settings: true
    server:
      bind_address: "0.0.0.0"
      limiter: false
      image_proxy: false
    search:
      formats:
        - html
        - json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-searxng
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}-searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-searxng
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-searxng
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ include "mycelis-core.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: searxng
          image: "{{ default "searxng/searxng:2025.5.1-a22437230" .Values.searxng.image }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SEARXNG_BASE_URL
              value: "http://{{ .Chart.Name }}-searxng:8080/"
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-searxng-secret" .Chart.Name) .Values.searxng.existingSecret }}
                  key: {{ default "searxng-secret" .Values.searxng.secretKey }}
                  optional: true
          {{- if .Values.searxng.resources }}
          resources:
            {{- toYaml .Values.searxng.resources | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: searxng-settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
      volumes:
        - name: searxng-settings
          configMap:
            name: {{ .Chart.Name }}-searxng-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-searxng
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}-searxng
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Chart.Name }}-searxng
{{- end }}
