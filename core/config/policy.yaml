# Governance Policy Configuration
# Defines the rules enforced by the Gatekeeper

groups:
  # 1. System Safety Net
  # Prevents accidental destruction of infrastructure
  - name: "System Critical"
    description: "Guard against destructive infrastructure operations"
    targets: ["*"] # Apply to ALL agents
    rules:
      - intent: "k8s.delete.*" # Regex match
        action: "REQUIRE_APPROVAL"
      - intent: "system.shutdown"
        action: "DENY"

  # 2. Financial Guardrails
  # Prevents excessive spending
  - name: "Finance Limits"
    description: "Cap autonomous spending"
    targets: ["team:finance", "agent:finance-bot"]
    rules:
      - intent: "payment.create"
        condition: "amount > 50" # Context variable check
        action: "REQUIRE_APPROVAL"
      - intent: "stripe.charge"
        condition: "amount > 100"
        action: "REQUIRE_APPROVAL"

  # 3. High Velocity IoT
  # Allow telemetry, block configuration changes
  - name: "IoT Safety"
    targets: ["team:robotics", "team:sensors"]
    rules:
      - intent: "firmware.update"
        action: "REQUIRE_APPROVAL"
      - intent: "motor.set_speed"
        condition: "rpm > 8000"
        action: "DENY"

  # 4. Delivery posture approval floors (stricter-only)
  # posture:<outcome-template-id> groups apply only to Soma work shaped by that
  # Outcome Template. They may only REQUIRE_APPROVAL, carry no condition, and
  # use an anchored regex over planned tool names and capability ids. They can
  # never lower an approval decision. operations-desk has no group on purpose.
  - name: "Posture: Governed Enterprise"
    description: "Every planned mutation requires approval"
    targets: ["posture:delivery-posture-governed-enterprise"]
    rules:
      - intent: "^.*$"
        action: "REQUIRE_APPROVAL"

  - name: "Posture: Client Delivery Studio"
    description: "Client-facing file, media and artifact output requires approval"
    targets: ["posture:delivery-posture-client-delivery-studio"]
    rules:
      - intent: "^(file_output|media_output|write_file|store_artifact|generate_image)$"
        action: "REQUIRE_APPROVAL"

  - name: "Posture: Product Delivery Team"
    description: "File output and team orchestration require approval"
    targets: ["posture:delivery-posture-product-delivery-team"]
    rules:
      - intent: "^(file_output|team_orchestration|write_file|create_team|delegate_task)$"
        action: "REQUIRE_APPROVAL"

defaults:
  default_action: "ALLOW" # Allow benign chatter and thinking
