# Governance Policy Configuration
# Defines the rules enforced by the Gatekeeper

groups:
  # 1. System Safety Net
  # Prevents accidental destruction of infrastructure
  - name: "System Critical"
    description: "Guard against destructive infrastructure operations"
    targets: ["*"] # Apply to ALL agents
    rules:
      - intent: "k8s.delete.*" # Regex match
        action: "REQUIRE_APPROVAL"
      - intent: "system.shutdown"
        action: "DENY"

  # 2. Financial Guardrails
  # Prevents excessive spending
  - name: "Finance Limits"
    description: "Cap autonomous spending"
    targets: ["team:finance", "agent:finance-bot"]
    rules:
      - intent: "payment.create"
        condition: "amount > 50" # Context variable check
        action: "REQUIRE_APPROVAL"
      - intent: "stripe.charge"
        condition: "amount > 100"
        action: "REQUIRE_APPROVAL"

  # 3. High Velocity IoT
  # Allow telemetry, block configuration changes
  - name: "IoT Safety"
    targets: ["team:robotics", "team:sensors"]
    rules:
      - intent: "firmware.update"
        action: "REQUIRE_APPROVAL"
      - intent: "motor.set_speed"
        condition: "rpm > 8000"
        action: "DENY"

  # 4. Delivery Approval Postures (MYC-RC-004B)
  # Graduated approval postures referenced by organization starters'
  # delivery_defaults.approval_policy_ref.
  - name: "delivery-approve-external"
    description: "Studio starter posture: nothing leaves the organization unapproved"
    targets: ["team:studio-delivery"]
    rules:
      - intent: "delivery.send.*"
        action: "REQUIRE_APPROVAL"
      - intent: "delivery.publish.*"
        action: "REQUIRE_APPROVAL"

  - name: "delivery-approve-changes"
    description: "SaaS starter posture: deploy and write actions need approval"
    targets: ["team:product-delivery"]
    rules:
      - intent: "delivery.deploy.*"
        action: "REQUIRE_APPROVAL"
      - intent: "delivery.write.*"
        action: "REQUIRE_APPROVAL"

  - name: "delivery-approve-state-change"
    description: "Operations starter posture: bounded execution, approval on high-risk actions"
    targets: ["team:ops-desk"]
    rules:
      - intent: "delivery.state_change.*"
        action: "REQUIRE_APPROVAL"
      - intent: "delivery.high_risk.*"
        action: "REQUIRE_APPROVAL"

  - name: "delivery-approve-all"
    description: "Regulated starter posture: every mutation needs approval and full audit"
    targets: ["team:governed-program"]
    rules:
      - intent: "delivery.*"
        action: "REQUIRE_APPROVAL"

defaults:
  default_action: "ALLOW" # Allow benign chatter and thinking
